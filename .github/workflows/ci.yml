name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm test:licenses --output dependency-sbom.cdx.json
      - name: Upload dependency SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-sbom
          path: dependency-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm test:assets
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm exec playwright test
        env:
          PLAYWRIGHT_ALL_BROWSERS: "1"
          PLAYWRIGHT_SKIP_VISUAL_REGRESSION: "1"
      - name: Run pinned visual regression gate
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" --ipc=host
          -e HOME=/tmp
          -e PLAYWRIGHT_VISUAL_BASELINE=linux-noble
          -e PATH=/work/node_modules/.bin:/usr/local/bin:/usr/bin:/bin
          -v "$PWD:/work"
          -w /work
          mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
          bash -lc
          'vite preview --host 127.0.0.1 >/tmp/vite.log 2>&1 &
          sleep 2;
          playwright test --project=chromium --grep "Saslik visual regression"'
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Backend sanitizer gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          cmake ninja-build pkg-config libcurl4-openssl-dev
          libmicrohttpd-dev nlohmann-json3-dev
      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DSMITHPROXY_GUI_BUILD_FRONTEND=OFF
          -DCMAKE_CXX_FLAGS="-Werror -fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-ci --parallel 2
      - name: Build backend inventory
        run: cmake --build build-ci --target backend-sbom
      - name: Upload backend SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-sbom
          path: build-ci/backend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-ci --output-on-failure
